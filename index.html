<!-- ================================================================
     Zeichenvorrat: Papierfilter, Wolke, Kirschbäume.
     Der Block zwischen SAKURA:BEGIN und SAKURA:END wird von
     tools/make_trees.py erzeugt — von Hand nichts darin ändern.
     ================================================================ -->
<svg class="assets" width="0" height="0" aria-hidden="true" focusable="false">
  <defs>
    <!-- ============ Papierfilter ============
         Jeder macht aus einer flachen Farbfläche ein Blatt:
         1. Kante leicht verziehen (gerissen statt geschnitten)
         2. heller Faserkern entlang der Kante
         3. Fasern in der Fläche
         4. Schatten auf die Schicht darunter
         Farben von Kern und Schatten kommen aus dem CSS (.rim / .shade),
         damit die Nachtfassung sie austauschen kann. -->
    <filter id="paper" x="-8%" y="-12%" width="116%" height="132%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="4" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G" result="shape"/>
      <feMorphology in="shape" operator="erode" radius="1.5" result="inner"/>
      <feFlood class="rim" result="rc"/>
      <feComposite in="rc" in2="shape" operator="in" result="rim"/>
      <feMerge result="edge"><feMergeNode in="shape"/><feMergeNode in="rim"/><feMergeNode in="inner"/></feMerge>
      <feTurbulence type="fractalNoise" baseFrequency="0.75 0.28" numOctaves="3" seed="5" result="f"/>
      <feColorMatrix in="f" type="matrix" values="1.1 1.1 0 0 -.6  1.1 1.1 0 0 -.6  1.1 1.1 0 0 -.6  0 0 0 0 1" result="g"/>
      <feComposite in="edge" in2="g" operator="arithmetic" k1=".14" k2=".93" k3="0" k4="0" result="sheet"/>
      <feGaussianBlur in="shape" stdDeviation="4.5" result="sb"/>
      <feOffset in="sb" dx="2" dy="6" result="so"/>
      <feFlood class="shade" result="sc"/>
      <feComposite in="sc" in2="so" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="sheet"/></feMerge>
    </filter>

    <!-- wie #paper, aber der Schatten fällt nach oben/hinten: für Bodenbänder,
         die vor der dahinterliegenden Schicht stehen -->
    <filter id="paperUp" x="-4%" y="-30%" width="108%" height="140%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="4" seed="14" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="6" xChannelSelector="R" yChannelSelector="G" result="shape"/>
      <feMorphology in="shape" operator="erode" radius="1.5" result="inner"/>
      <feFlood class="rim" result="rc"/>
      <feComposite in="rc" in2="shape" operator="in" result="rim"/>
      <feMerge result="edge"><feMergeNode in="shape"/><feMergeNode in="rim"/><feMergeNode in="inner"/></feMerge>
      <feTurbulence type="fractalNoise" baseFrequency="0.75 0.28" numOctaves="3" seed="8" result="f"/>
      <feColorMatrix in="f" type="matrix" values="1.1 1.1 0 0 -.6  1.1 1.1 0 0 -.6  1.1 1.1 0 0 -.6  0 0 0 0 1" result="g"/>
      <feComposite in="edge" in2="g" operator="arithmetic" k1=".14" k2=".93" k3="0" k4="0" result="sheet"/>
      <feGaussianBlur in="shape" stdDeviation="5" result="sb"/>
      <feOffset in="sb" dx="0" dy="-5" result="so"/>
      <feFlood class="shade" result="sc"/>
      <feComposite in="sc" in2="so" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="sheet"/></feMerge>
    </filter>

    <!-- kleine Formen: Blüten, Tiere, Sonne, Mond -->
    <filter id="paperSoft" x="-12%" y="-12%" width="124%" height="132%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="4" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.4" xChannelSelector="R" yChannelSelector="G" result="shape"/>
      <feMorphology in="shape" operator="erode" radius="1" result="inner"/>
      <feFlood class="rim" result="rc"/>
      <feComposite in="rc" in2="shape" operator="in" result="rim"/>
      <feMerge result="edge"><feMergeNode in="shape"/><feMergeNode in="rim"/><feMergeNode in="inner"/></feMerge>
      <feTurbulence type="fractalNoise" baseFrequency="0.8 0.4" numOctaves="3" seed="6" result="f"/>
      <feColorMatrix in="f" type="matrix" values="1.1 1.1 0 0 -.6  1.1 1.1 0 0 -.6  1.1 1.1 0 0 -.6  0 0 0 0 1" result="g"/>
      <feComposite in="edge" in2="g" operator="arithmetic" k1=".14" k2=".93" k3="0" k4="0" result="sheet"/>
      <feGaussianBlur in="shape" stdDeviation="2.4" result="sb"/>
      <feOffset in="sb" dx="1.5" dy="3.5" result="so"/>
      <feFlood class="shade" result="sc"/>
      <feComposite in="sc" in2="so" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="sheet"/></feMerge>
    </filter>

    <!-- ohne hellen Kern: dünne Formen wie Zweige und Tierbeine bestünden
         sonst nur noch aus Rand -->
    <filter id="paperPlain" x="-12%" y="-12%" width="124%" height="132%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="3" seed="12" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G" result="shape"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.8 0.4" numOctaves="3" seed="6" result="f"/>
      <feColorMatrix in="f" type="matrix" values="1.1 1.1 0 0 -.6  1.1 1.1 0 0 -.6  1.1 1.1 0 0 -.6  0 0 0 0 1" result="g"/>
      <feComposite in="shape" in2="g" operator="arithmetic" k1=".14" k2=".93" k3="0" k4="0" result="sheet"/>
      <feGaussianBlur in="shape" stdDeviation="2.2" result="sb"/>
      <feOffset in="sb" dx="1.5" dy="3.5" result="so"/>
      <feFlood class="shade" result="sc"/>
      <feComposite in="sc" in2="so" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="sheet"/></feMerge>
    </filter>

    <!-- Weltall: immer dunkel, deshalb feste Werte statt der Themenfarben -->
    <filter id="paperSpace" x="-6%" y="-8%" width="112%" height="120%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="4" seed="2" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="26" xChannelSelector="R" yChannelSelector="G" result="shape"/>
      <feMorphology in="shape" operator="erode" radius="1.6" result="inner"/>
      <feFlood flood-color="#A6ABD6" flood-opacity=".30" result="rc"/>
      <feComposite in="rc" in2="shape" operator="in" result="rim"/>
      <feMerge result="edge"><feMergeNode in="shape"/><feMergeNode in="rim"/><feMergeNode in="inner"/></feMerge>
      <feTurbulence type="fractalNoise" baseFrequency="0.7 0.3" numOctaves="3" seed="11" result="f"/>
      <feColorMatrix in="f" type="matrix" values="1.1 1.1 0 0 -.6  1.1 1.1 0 0 -.6  1.1 1.1 0 0 -.6  0 0 0 0 1" result="g"/>
      <feComposite in="edge" in2="g" operator="arithmetic" k1=".2" k2=".9" k3="0" k4="0" result="sheet"/>
      <feGaussianBlur in="shape" stdDeviation="9" result="sb"/>
      <feOffset in="sb" dx="3" dy="8" result="so"/>
      <feFlood flood-color="#000" flood-opacity=".55" result="sc"/>
      <feComposite in="sc" in2="so" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="sheet"/></feMerge>
    </filter>

    <!-- Schrift wie mit der Schere geschnitten: eine langwellige, kaum sichtbare
         Unruhe. Feinere Störung gäbe Kerben in den Buchstaben. Der Bereich ist
         nach oben und unten weit, weil das Grußwort beim Wechsel aus der Zeile gleitet. -->
    <filter id="cut" x="-3%" y="-45%" width="106%" height="190%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5" xChannelSelector="R" yChannelSelector="G" result="shape"/>
      <feGaussianBlur in="shape" stdDeviation="1.1" result="sb"/>
      <feOffset in="sb" dx="1" dy="2.2" result="so"/>
      <feFlood class="shade" result="sc"/>
      <feComposite in="sc" in2="so" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="shape"/></feMerge>
    </filter>

    <!-- nur die unruhige Kante, ohne Kern und Schatten (Textmarker) -->
    <filter id="torn" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="4" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <symbol id="cloud" viewBox="0 0 210 92">
      <!-- zwei Blätter: das untere schaut versetzt hervor -->
      <g class="cloud__under" transform="translate(9 7)">
        <ellipse cx="50" cy="52" rx="34" ry="25"/>
